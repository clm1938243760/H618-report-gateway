[project]
name = "gadget-msc-printer"
version = "0.22.5"
description = "Standalone USB mass-storage and printer gadget collector"
requires-python = ">=3.9"
dependencies = [
  "Pillow>=9.5.0",
  "PyYAML>=6.0",
  "aiohttp>=3.8.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
